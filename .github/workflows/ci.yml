name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Тесты и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Юнит-тесты :core
        run: ./gradlew :core:test

      - name: Метрики валидации в сводку
        if: always()
        run: cat core/build/validation/metrics.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: Артефакт метрик валидации
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-metrics
          path: core/build/validation/
          if-no-files-found: ignore

      - name: Юнит-тесты и lint :app
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Сборка debug APK
        run: ./gradlew :app:assembleDebug

      - name: Отчёт тестов
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-reports
          path: |
            core/build/reports/tests/
            app/build/reports/

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: bk-phenix-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
